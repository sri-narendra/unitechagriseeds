<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Requests — Admin Portal</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="top"><div class="container top-inner">
  <a class="brand" href="dashboard.html">🌿 Unitech Agri Seeds — Admin</a>
  <nav class="tabs">
    <a class="tab" href="dashboard.html">Dashboard</a>
    <a class="tab" href="products.html">Products</a>
    <a class="tab" href="dealers.html">Dealers</a>
    <a class="tab active" href="orders.html">Orders</a>
    <a class="tab" href="returns.html">Returns</a>
  </nav>
  <button id="logout" class="btn btn-ghost btn-sm">Log out</button>
</div></header>

<main class="container">
  <h1 class="page-title">Order requests</h1>
  <p class="hint" style="margin-top:-8px;margin-bottom:var(--sp-4)">Approving sends stock to the dealer and
  marks the order <b>sent</b> — all in one atomic step.</p>

  <div class="toolbar">
    <div class="search-input">
      <input id="search" placeholder="Search orders…">
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Requested</th><th>Dealer</th><th>Items</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">No order requests yet.</div>
  </div>
</main>
<div class="toast-wrap" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- shared config (identical in every page — docs/backendStack.md §3) ----
  const SUPABASE_URL      = "https://eotigemxfgszrtrrfdma.supabase.co";   // TODO: your project URL
  const SUPABASE_ANON_KEY = "sb_publishable_Our1GSi2nUfzrNq6tdE1IA_iv75P5gN";                     // TODO: your anon key (public by design)
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const fmtDate = iso => iso ? new Date(iso).toLocaleString() : "";
  function toast(msg, ok = true) {
    const t = document.createElement("div");
    t.className = "toast" + (ok ? "" : " err");
    t.textContent = msg;
    $("#toasts").appendChild(t);
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3000);
  }
  function pill(status) { return '<span class="pill pill-' + esc(status) + '">' + esc(status) + "</span>"; }
  function friendly(err) {
    const m = String(err && err.message || err || "");
    if (m.includes("NOT_PENDING")) return "This order was already processed.";
    if (m.includes("RETURN_NOT_PENDING"))  return "Return has already been processed.";
    if (m.includes("ORDER_NOT_PENDING"))   return "Order has already been processed.";
    if (m.includes("CONCURRENT_MODIFICATION")) return "Record was modified by someone else. Reload and try again.";
    if (m.includes("PRODUCT_INACTIVE"))   return "This product is inactive and cannot be used.";
    if (m.includes("FORBIDDEN"))   return "You are not allowed to do that.";
    return "Something went wrong. Please try again.";
  }
  async function getSession() { const { data } = await supabaseClient.auth.getSession(); return data.session || null; }
  function go(url) { location.href = url; }
</script>
<script>
(async () => {
  const supabase = supabaseClient;
  // ---- auth guard (admin only) ----
  const session = await getSession();
  if (!session) return go("index.html");
  if (session.user.app_metadata.role !== "admin") {
    await supabase.auth.signOut(); return go("index.html");
  }
  document.getElementById("logout").addEventListener("click",
    () => supabase.auth.signOut().then(() => go("index.html")));

  async function loadOrders() {
    const { data } = await supabase
      .from("orders")
      .select("id, status, created_at, dealers(shop_name), order_items(quantity, products(name))")
      .order("created_at", { ascending: false })
      .limit(50);
    const rows = document.getElementById("rows");
    const empty = document.getElementById("empty");
    if (!data || data.length === 0) { empty.style.display = "block"; rows.innerHTML = ""; return; }
    // pending first, newest first within each group
    const sorted = [...data].sort((a, b) =>
      (a.status === "pending" ? 0 : 1) - (b.status === "pending" ? 0 : 1));
    const q = (document.getElementById("search").value || "").trim().toLowerCase();
    const list = q ? sorted.filter(o =>
      ((o.dealers && o.dealers.shop_name) || "").toLowerCase().includes(q) ||
      (o.status || "").includes(q) ||
      (o.order_items || []).some(i => i.products && (i.products.name || "").toLowerCase().includes(q))) : sorted;
    if (list.length === 0) {
      rows.innerHTML = '<tr><td colspan="5" class="empty">No orders match your search.</td></tr>';
      return;
    }
    empty.style.display = "none";
    rows.innerHTML = list.map(o => `<tr>
      <td>${fmtDate(o.created_at)}</td>
      <td>${esc(o.dealers ? o.dealers.shop_name : "—")}</td>
      <td>${(o.order_items || []).map(i => `${esc(i.products ? i.products.name : "—")} × ${i.quantity}`).join("<br>")}</td>
      <td>${pill(o.status)}</td>
      <td>${o.status === "pending" ? `
        <button class="btn btn-primary btn-sm" data-approve="${o.id}">Approve &amp; send</button>
        <button class="btn btn-danger btn-sm" data-reject="${o.id}">Reject</button>` : "—"}</td>
    </tr>`).join("");

    rows.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", () => act("approve_order", b.dataset.approve, b)));
    rows.querySelectorAll("[data-reject]").forEach(b => b.addEventListener("click", () => act("reject_order", b.dataset.reject, b)));
  }

  async function act(fn, orderId, btn) {
    const label = fn === "approve_order" ? "Order approved — stock sent." : "Order rejected.";
    btn.disabled = true;
    try {
      const { error } = await supabase.rpc(fn, { p_order: orderId });
      if (error) throw error;
      toast(label);
      await loadOrders();
    } catch (ex) {
      toast(friendly(ex), false);
      btn.disabled = false;
    }
  }

  document.getElementById("search").addEventListener("input", loadOrders);

  await loadOrders();
})();
</script>
</body>
</html>
