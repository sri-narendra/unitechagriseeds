<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Sale — Dealer Portal</title>
<link rel="stylesheet" href="/dealer/shared.css">
</head>
<body class="dealer-portal">
<header class="top"><div class="container top-inner">
  <a class="brand" href="stock.html">🌿 Unitech Agri Seeds</a>
  <nav class="tabs dealer-tabs">
    <a class="tab" href="stock.html">Stock Stats</a>
    <a class="tab" href="return.html">Return</a>
    <a class="tab active" href="sale.html">Sale</a>
    <a class="tab" href="order.html">Order</a>
  </nav>
  <button id="logout" class="btn btn-ghost btn-sm">Log out</button>
</div></header>

<main class="container">
  <h1 class="page-title">Record a sale</h1>
  <div class="form-card">
    <div class="field">
      <label for="product">Product sold</label>
      <select id="product"></select>
      <p class="hint" id="avail"></p>
    </div>
    <div class="field-row">
      <div class="field" style="flex:1">
        <label for="qty">Quantity</label>
        <input id="qty" type="number" min="1" step="1" inputmode="numeric" value="1">
      </div>
      <div class="field" style="flex:1">
        <label for="unit">Unit</label>
        <select id="unit">
          <option value="packet">Packets</option>
          <option value="bag">Bags</option>
        </select>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" id="add-item" type="button">+ Add item</button>
    </div>
  </div>

  <div class="card" id="sale-cart" style="display:none;max-width:640px;margin-top:var(--sp-4)">
    <h3 class="section-title" style="margin-top:0">Sale items</h3>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Product</th><th class="num">Qty</th><th></th></tr></thead>
        <tbody id="sale-rows"></tbody>
      </table>
    </div>
    <div class="spread" style="margin-top:var(--sp-4)">
      <button class="btn btn-ghost btn-sm" id="clear-cart" type="button">Clear</button>
      <button class="btn btn-primary" id="submit" type="button" disabled>Record sale</button>
    </div>
  </div>

  <h2 class="section-title">My recent sales</h2>
  <div class="table-wrap">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Items</th><th>When</th></tr></thead>
        <tbody id="sales-rows"><tr><td colspan="2"><div class="skeleton"></div></td></tr></tbody>
      </table>
    </div>
    <div class="empty" id="sales-empty" style="display:none">No sales recorded yet.</div>
  </div>
</main>
<div class="toast-wrap" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- shared config (identical in every page — docs/backendStack.md §3) ----
  const SUPABASE_URL      = "https://eotigemxfgszrtrrfdma.supabase.co";   // TODO: your project URL
  const SUPABASE_ANON_KEY = "sb_publishable_Our1GSi2nUfzrNq6tdE1IA_iv75P5gN";                     // TODO: your anon key (public by design)
  const LOGIN_DOMAIN      = "@agri.local";       // dealer Account ID -> login email
  const LOW_STOCK_MAX     = 0;                            // dealer total <= this = low stock
  const EXCESS_TOTAL      = 1000;                         // dealer total >= this = excess stock
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const fmtDate = iso => iso ? new Date(iso).toLocaleString() : "";
  function toast(msg, ok = true) {
    const t = document.createElement("div");
    t.className = "toast" + (ok ? "" : " err");
    t.textContent = msg;
    $("#toasts").appendChild(t);
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3000);
  }
  function pill(status) { return '<span class="pill pill-' + esc(status) + '">' + esc(status) + "</span>"; }
  function friendly(err) {
    const m = String(err && err.message || err || "");
    if (m.includes("INSUFFICIENT_STOCK"))    return "Not enough stock for this quantity.";
    if (m.includes("VALIDATION_ERROR"))      return "Please enter a positive whole number.";
    if (m.includes("RETURN_NOT_PENDING"))    return "This return was already processed.";
    if (m.includes("ORDER_NOT_PENDING"))     return "This order was already processed.";
    if (m.includes("CONCURRENT_MODIFICATION")) return "Another action modified this record. Please refresh.";
    if (m.includes("PRODUCT_INACTIVE"))      return "This product is no longer active.";
    if (m.includes("NOT_PENDING"))           return "This request was already processed.";
    if (m.includes("FORBIDDEN"))             return "You are not allowed to do that.";
    if (m.includes("NOT_FOUND"))             return "This record no longer exists.";
    return "Something went wrong. Please try again.";
  }
  async function getSession() { const { data } = await supabaseClient.auth.getSession(); return data.session || null; }
  function go(url) { location.href = url; }
</script>
<script>
(async () => {
  const supabase = supabaseClient;
  // ---- auth guard (dealer only) ----
  const session = await getSession();
  if (!session) return go("index.html");
  const dealerId = session.user.app_metadata.dealer_id;
  const role = session.user.app_metadata.role;
  if (role !== "dealer" || !dealerId) { await supabase.auth.signOut(); return go("index.html"); }
  document.getElementById("logout").addEventListener("click",
    () => supabase.auth.signOut().then(() => go("index.html")));

  let stockRows = [];
  let saleClientRef = crypto.randomUUID();
  const saleCart = new Map();   // product_id -> quantity (multi-item — §5.1)

  async function loadStock() {
    const { data } = await supabase
      .from("dealer_stock")
      .select("quantity, product_id, products(name, packets_per_bag)")
      .eq("dealer_id", dealerId)
      .order("updated_at", { ascending: false });
    stockRows = data || [];
    const sel = document.getElementById("product");
    if (stockRows.length === 0) {
      sel.innerHTML = '<option value="">No stock available</option>';
      sel.disabled = true;
      document.getElementById("add-item").disabled = true;
      document.getElementById("avail").textContent = "";
      return;
    }
    sel.disabled = false;
    document.getElementById("add-item").disabled = false;
    sel.innerHTML = stockRows.map(r =>
      `<option value="${r.product_id}" data-ppb="${r.products?.packets_per_bag || ''}">${esc(r.products ? r.products.name : "Unknown")} — ${r.quantity} packets${r.products?.packets_per_bag ? ` (${(r.quantity / r.products.packets_per_bag).toFixed(2)} bags)` : ''} in stock</option>`).join("");
    updateAvail();
  }

  function updateAvail() {
    const sel = document.getElementById("product");
    const opt = sel.options[sel.selectedIndex];
    const ppb = opt?.dataset?.ppb ? parseInt(opt.dataset.ppb) : null;
    const row = stockRows.find(r => r.product_id === sel.value);
    if (!row) { document.getElementById("avail").textContent = ""; return; }
    const qty = row.quantity;
    const bags = ppb && ppb > 0 ? (qty / ppb).toFixed(2) : null;
    document.getElementById("avail").textContent = `Available: ${qty} packets${bags ? ` (${bags} bags)` : ''}`;
    // Disable "Bag" option if product has no packets_per_bag
    const unitSel = document.getElementById("unit");
    if (unitSel) {
      const bagOpt = unitSel.querySelector('option[value="bag"]');
      if (bagOpt) bagOpt.disabled = !ppb;
    }
  }
  document.getElementById("product").addEventListener("change", updateAvail);

  // ---- sale cart ----
  function renderCart() {
    const card = document.getElementById("sale-cart");
    const rows = document.getElementById("sale-rows");
    const submit = document.getElementById("submit");
    if (saleCart.size === 0) {
      card.style.display = "none"; rows.innerHTML = ""; submit.disabled = true;
      return;
    }
    card.style.display = "block";
    rows.innerHTML = [...saleCart.entries()].map(([pid, item]) => {
      const p = stockRows.find(r => r.product_id === pid);
      const name = p && p.products ? p.products.name : "Unknown";
      const ppb = p?.products?.packets_per_bag;
      const bags = ppb && ppb > 0 ? (item.qty / ppb).toFixed(2) : null;
      const max = p ? p.quantity : item.qty;
      return `<tr>
        <td>${esc(name)}</td>
        <td class="num"><span class="row" style="gap:6px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" data-dec="${pid}" ${item.qty <= 1 ? "disabled" : ""}>−</button>
          <b class="num">${item.qty} pkt${bags ? ` (${bags} bags)` : ''}</b>
          <button class="btn btn-ghost btn-sm" data-inc="${pid}" ${item.qty >= max ? "disabled" : ""}>+</button>
        </span></td>
        <td><button class="btn btn-danger btn-sm" data-rm="${pid}">Remove</button></td>
      </tr>`;
    }).join("");
    submit.disabled = false;
    rows.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.dec; saleCart.set(id, { ...saleCart.get(id), qty: saleCart.get(id).qty - 1 }); renderCart();
    }));
    rows.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.inc;
      const p = stockRows.find(r => r.product_id === id);
      if (p && saleCart.get(id).qty < p.quantity) { saleCart.set(id, { ...saleCart.get(id), qty: saleCart.get(id).qty + 1 }); renderCart(); }
    }));
    rows.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
      saleCart.delete(b.dataset.rm); renderCart();
    }));
  }

  document.getElementById("add-item").addEventListener("click", () => {
    const pid = document.getElementById("product").value;
    const qty = Number(document.getElementById("qty").value);
    const unit = document.getElementById("unit").value;
    if (!pid) return toast("No stock available to sell.", false);
    if (!Number.isSafeInteger(qty) || qty <= 0) return toast("Enter a positive whole number.", false);
    const p = stockRows.find(r => r.product_id === pid);
    const ppb = p?.products?.packets_per_bag;
    if (unit === 'bag' && !ppb) return toast("This product doesn't have packets per bag configured.", false);
    const packetsToAdd = unit === 'bag' && ppb ? qty * ppb : qty;
    const existing = saleCart.get(pid);
    const currentQty = existing ? existing.qty : 0;
    const newQty = currentQty + packetsToAdd;
    if (p && newQty > p.quantity) return toast(`Only ${p.quantity} packets available in stock.`, false);
    saleCart.set(pid, { qty: newQty, unit });
    renderCart();
    toast(`${p && p.products ? p.products.name : "Item"} added to sale.`);
  });
  document.getElementById("clear-cart").addEventListener("click", () => { saleCart.clear(); renderCart(); });

  document.getElementById("submit").addEventListener("click", async () => {
    const submit = document.getElementById("submit");
    if (saleCart.size === 0) return;
    submit.disabled = true;
    try {
      const items = [...saleCart.entries()].map(([product_id, item]) => ({ product_id, quantity: item.qty, unit: item.unit }));
      const { data, error } = await supabase.rpc("record_sale", {
        p_items: items,
        p_client_ref: saleClientRef,
      });
      if (error) throw error;
      saleClientRef = crypto.randomUUID();
      toast(`Sale recorded — ${items.length} item${items.length === 1 ? "" : "s"} updated.`);
      saleCart.clear();
      renderCart();
      await loadStock();
      await loadSales();
    } catch (ex) {
      toast(friendly(ex), false);
    } finally {
      submit.disabled = saleCart.size === 0;
    }
  });

  async function loadSales() {
    const { data } = await supabase
      .from("sale_transactions")
      .select("created_at, sale_items(quantity, products(name, packets_per_bag))")
      .eq("dealer_id", dealerId)
      .order("created_at", { ascending: false })
      .limit(5);
    const rows = document.getElementById("sales-rows");
    const empty = document.getElementById("sales-empty");
    if (!data || data.length === 0) { empty.style.display = "block"; rows.innerHTML = ""; return; }
    empty.style.display = "none";
    rows.innerHTML = data.map(s => `<tr>
      <td>${(s.sale_items || []).map(i => {
        const qty = i.quantity;
        const ppb = i.products?.packets_per_bag;
        const bags = ppb && ppb > 0 ? (qty / ppb).toFixed(2) : null;
        return `${esc(i.products ? i.products.name : "—")} × ${qty} pkt${bags ? ` (${bags} bags)` : ''}`;
      }).join("<br>")}</td>
      <td>${fmtDate(s.created_at)}</td>
    </tr>`).join("");
  }

  await loadStock();
  await loadSales();
})();
</script>
</body>
</html>
